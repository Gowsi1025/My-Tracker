<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyTasks</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4772fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#1f2430;--muted:#7a8194;--line:#e6e8ef;--accent:#4772fa;--p1:#5c9cff;--p2:#f5a623;--p3:#e5484d;--over:#e5484d;--hover:#eef1fb}
[data-theme=dark]{--bg:#14161c;--panel:#1d2028;--text:#e8eaf0;--muted:#8b92a5;--line:#2a2e39;--accent:#6b8cff;--hover:#262a36}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;height:100dvh}
#side{width:260px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:12px 8px}
.brand{font-weight:700;font-size:18px;padding:6px 10px 12px;color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--hover);color:var(--accent);font-weight:600}
.nav b{font-weight:500;color:var(--muted);font-size:12px}
.nav .x{border:0;background:none;color:var(--muted);padding:0 4px}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 4px}
.sec button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.foot button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;text-align:left}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
header h1{margin:0;font-size:22px}
#menu{display:none;border:0;background:none;font-size:22px;padding:0 4px}
#quick{display:flex;gap:8px;padding:6px 16px 10px}
#quick input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
#quick input:focus{border-color:var(--accent)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
#content{flex:1;overflow-y:auto;padding:0 16px 80px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--accent)}
.chk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:none;margin-top:1px;padding:0}
.p1 .chk{border-color:var(--p1)}.p2 .chk{border-color:var(--p2)}.p3 .chk{border-color:var(--p3)}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tbody{min-width:0;flex:1}
.ttitle{word-break:break-word}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:3px}
.tmeta .over{color:var(--over)}
.tag{color:var(--accent);cursor:pointer}
.gh{color:var(--muted);font-size:13px;font-weight:600;margin:16px 2px 6px}
.empty{color:var(--muted);text-align:center;padding:60px 10px}
.hab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.hab-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hab-top small{color:var(--muted)}
.hab-top .x{border:0;background:none;color:var(--muted);font-size:18px}
.days{display:flex;gap:8px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.day button{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none}
.day button.on{background:var(--accent);border-color:var(--accent)}
.focus{max-width:380px;margin:30px auto;text-align:center}
.modes{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.modes button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px}
.modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#f-time{font-size:76px;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0}
.focus .row{display:flex;gap:10px;justify-content:center}
.focus .row button:not(.primary){border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.sheet{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.sheet input:focus,.sheet textarea:focus{border-color:var(--accent)}
.sheet textarea{min-height:70px;resize:vertical}
.sheet label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{display:flex;align-items:center;gap:8px}
.sub input[type=checkbox]{width:18px;flex:none}
.sub button{border:0;background:none;color:var(--muted);font-size:18px}
.actions{display:flex;gap:8px;align-items:center}
.actions span{flex:1}
.actions button{border:1px solid var(--line);background:none;border-radius:10px;padding:9px 14px}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions .danger{color:var(--p3)}
.sheet>button:not(.primary){border:1px solid var(--line);background:none;border-radius:10px;padding:10px}
.err{color:var(--p3);font-size:13px;min-height:18px}
#auth a{font-size:13px;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#search{margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);outline:none;width:190px;max-width:45vw}
#search:focus{border-color:var(--accent)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .cd{aspect-ratio:1;max-height:70px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px}
.cal .cd.td{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal .cd.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal .cd i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .cd.sel i{background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:4px}
.bar div{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
@media(max-width:799px){
 #side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s}
 #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
 #menu{display:block}
 #f-time{font-size:64px}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side"></aside>
 <main>
  <header><button id="menu" aria-label="Menu">☰</button><h1 id="title"></h1><input id="search" type="search" placeholder="Search tasks…" autocomplete="off"></header>
  <div id="quick"><input id="q" placeholder='Add task… e.g. "Pay rent tomorrow #bills !high ~monthly"' autocomplete="off"><button class="primary" id="qadd">Add</button></div>
  <div id="content"></div>
 </main>
</div>

<div id="modal" class="overlay" hidden></div>

<div id="auth" class="overlay" hidden>
 <div class="sheet">
  <h2>MyTasks</h2>
  <p style="margin:0;color:var(--muted)">Sign in to sync across your devices.</p>
  <input id="a-email" type="email" placeholder="Email" autocomplete="email">
  <input id="a-pass" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
  <div id="a-err" class="err"></div>
  <button class="primary" id="a-in" style="padding:11px">Sign in</button>
  <button id="a-up">Create account</button>
  <a href="#" id="a-reset">Forgot password?</a>
 </div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
/* ============ SETUP: your Firebase config now lives in config.js ============
   Leave as null to use the app in local-only mode (no sync).
   Example:
   const FIREBASE_CONFIG = {
     apiKey: "...", authDomain: "...", projectId: "...",
     storageBucket: "...", messagingSenderId: "...", appId: "..."
   };
*/
const FIREBASE_CONFIG = window.FIREBASE_CONFIG||null;
/* ==================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+n);return ymd(d)};
function dueLabel(d){const td=today();if(d===td)return'Today';if(d===addDays(td,1))return'Tomorrow';if(d===addDays(td,-1))return'Yesterday';
 return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
const syncErr=e=>toast('Sync error: '+(e&&e.code||e));

/* ---------- state ---------- */
const S={tasks:{},habits:{},lists:['Inbox'],view:{type:'smart',id:'today'}};
const Auth={user:null};
let M=null; // task being edited
let searchQ='',calMonth=today().slice(0,7)+'-01',calSel=today();
const KEY='mytasks_v1';

const DB={
 cloud:null,
 loadLocal(){try{const j=JSON.parse(localStorage.getItem(KEY)||'{}');S.tasks=j.tasks||{};S.habits=j.habits||{};S.lists=j.lists&&j.lists.length?j.lists:['Inbox']}catch{}},
 persist(){if(!this.cloud)try{localStorage.setItem(KEY,JSON.stringify({tasks:S.tasks,habits:S.habits,lists:S.lists}))}catch{}},
 task(t){S.tasks[t.id]=t;this.cloud?this.cloud.set('tasks',t.id,t):this.persist();render()},
 delTask(id){delete S.tasks[id];this.cloud?this.cloud.del('tasks',id):this.persist();render()},
 habit(h){S.habits[h.id]=h;this.cloud?this.cloud.set('habits',h.id,h):this.persist();render()},
 delHabit(id){delete S.habits[id];this.cloud?this.cloud.del('habits',id):this.persist();render()},
 lists(){this.cloud?this.cloud.setLists(S.lists):this.persist();render()}
};

/* ---------- tasks logic ---------- */
function stepDue(d,r){return r==='daily'?addDays(d,1):r==='weekly'?addDays(d,7):addMonths(d,1)}
function nextDue(t){let d=t.due||today();do{d=stepDue(d,t.repeat)}while(d<=today());return d}
function toggle(id){const t=S.tasks[id];if(!t)return;
 if(!t.done&&t.repeat){t.hist=[...(t.hist||[]),Date.now()];t.due=nextDue(t);t.subtasks=(t.subtasks||[]).map(s=>({...s,d:false}));toast('Next: '+dueLabel(t.due))}
 else{t.done=!t.done;t.doneAt=t.done?Date.now():0}
 DB.task(t)}
function parseQuick(txt){
 let title=txt,due='',priority=0,tags=[],repeat='',time='';
 title=title.replace(/(^|\s)#([\w-]+)/g,(m,a,g)=>{tags.push(g);return a});
 title=title.replace(/(^|\s)!(high|h|3|medium|med|m|2|low|l|1)\b/gi,(m,a,p)=>{priority={h:3,high:3,'3':3,m:2,med:2,medium:2,'2':2,l:1,low:1,'1':1}[p.toLowerCase()];return a});
 title=title.replace(/(^|\s)~(daily|weekly|monthly)\b/gi,(m,a,r)=>{repeat=r.toLowerCase();return a});
 title=title.replace(/(^|\s)(today|tomorrow)\b/i,(m,a,w)=>{due=w.toLowerCase()==='today'?today():addDays(today(),1);return a});
 title=title.replace(/(^|\s)at\s(\d{1,2})(?::(\d{2}))?\s?(am|pm)?\b/i,(m,a,h,mi,ap)=>{h=+h;mi=+(mi||0);
  if(ap){ap=ap.toLowerCase();if(h<1||h>12)return m;if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0}
  if(h>23||mi>59)return m;time=pad(h)+':'+pad(mi);return a});
 if(time&&!due)due=today();
 return{title:title.replace(/\s+/g,' ').trim(),due,priority,tags,repeat,time};
}
function quickAdd(){
 const inp=$('#q'),txt=inp.value.trim();if(!txt)return;
 const p=parseQuick(txt);if(!p.title){toast('Add a title');return}
 const v=S.view;
 if(!p.due&&v.type==='smart'&&v.id==='today')p.due=today();
 if(v.type==='tag'&&!p.tags.includes(v.id))p.tags.push(v.id);
 DB.task({id:uid(),title:p.title,notes:'',due:p.due,time:p.time||'',priority:p.priority,list:v.type==='list'?v.id:'Inbox',tags:p.tags,subtasks:[],repeat:p.repeat,done:false,doneAt:0,created:Date.now()});
 inp.value='';
}
function cmpPri(a,b){return b.priority-a.priority||(a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:a.created-b.created}
function cmp(a,b){
 const x=(a.due||'9')+(a.time||'99'),y=(b.due||'9')+(b.time||'99');
 if(S.view.id==='upcoming')return x<y?-1:x>y?1:b.priority-a.priority||a.created-b.created;
 return b.priority-a.priority||(x<y?-1:x>y?1:a.created-b.created)}
function visible(){
 const T=Object.values(S.tasks),td=today(),{type,id}=S.view;let r=[];
 if(searchQ){const q=searchQ.toLowerCase();
  return T.filter(t=>(t.title+' '+(t.notes||'')+' '+(t.tags||[]).join(' ')+' '+(t.subtasks||[]).map(s=>s.t).join(' ')).toLowerCase().includes(q)).sort(cmp)}
 if(type==='smart'){
  if(id==='today')r=T.filter(t=>!t.done&&t.due&&t.due<=td);
  else if(id==='upcoming')r=T.filter(t=>!t.done&&t.due>td);
  else if(id==='all')r=T.filter(t=>!t.done);
  else if(id==='completed')return T.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
 }else if(type==='list')r=T.filter(t=>!t.done&&t.list===id);
 else if(type==='tag')r=T.filter(t=>!t.done&&(t.tags||[]).includes(id));
 return r.sort(cmp);
}

/* ---------- rendering ---------- */
function titleOf(v){
 if(v.type==='smart')return{today:'Today',upcoming:'Upcoming',all:'All tasks',completed:'Completed'}[v.id];
 if(v.type==='list')return v.id;if(v.type==='tag')return'#'+v.id;
 return{habits:'Habits',focus:'Focus timer',calendar:'Calendar',stats:'Stats'}[v.id];
}
function renderSide(){
 const open=Object.values(S.tasks).filter(t=>!t.done),td=today();
 const cnt={today:open.filter(t=>t.due&&t.due<=td).length,upcoming:open.filter(t=>t.due>td).length,all:open.length};
 const it=(type,id,label,icon,n,extra='')=>`<div class="nav ${S.view.type===type&&S.view.id===id?'on':''}" data-go="${type}:${esc(id)}"><span>${icon} ${esc(label)}</span><span>${n?`<b>${n}</b>`:''}${extra}</span></div>`;
 let h=`<div class="brand">✔ MyTasks</div>`+it('smart','today','Today','☀️',cnt.today)+it('smart','upcoming','Upcoming','📅',cnt.upcoming)+it('smart','all','All tasks','📥',cnt.all)+it('smart','completed','Completed','✅',0);
 h+=`<div class="sec">Lists <button data-act="addlist" title="New list">＋</button></div>`;
 S.lists.forEach(l=>{h+=it('list',l,l,'📁',open.filter(t=>t.list===l).length,l==='Inbox'?'':`<button class="x" data-act="dellist" data-list="${esc(l)}" title="Delete list">×</button>`)});
 h+=`<div class="sec">Tools</div>`+it('tool','habits','Habits','🔁',0)+it('tool','focus','Focus timer','🍅',0)+it('tool','calendar','Calendar','🗓️',0)+it('tool','stats','Stats','📊',0);
 h+=`<div class="foot"><button data-act="theme">🌓 Toggle dark mode</button><button data-act="notif">🔔 Enable reminders</button><button data-act="export">⬇️ Export backup</button><button data-act="import">⬆️ Import backup</button>`+
  (Auth.user?`<div>${esc(Auth.user.email)}</div><button data-act="signout">Sign out</button>`:`<div>${FIREBASE_CONFIG?'Not signed in':'Local only — not synced'}</div>`)+`</div>`;
 $('#side').innerHTML=h;
}
function row(t){
 const subs=t.subtasks||[],sd=subs.filter(s=>s.d).length,td=today();
 return `<div class="task p${t.priority} ${t.done?'done':''}" data-id="${t.id}">
 <button class="chk" data-act="toggle" aria-label="Complete"></button>
 <div class="tbody"><div class="ttitle">${esc(t.title)}</div><div class="tmeta">`+
 (t.due?`<span class="${t.due<td&&!t.done?'over':''}">${t.due<td&&!t.done?'Overdue · ':''}${dueLabel(t.due)}${t.time?' · '+t.time:''}</span>`:'')+
 (t.repeat?`<span>↻ ${t.repeat}</span>`:'')+(subs.length?`<span>☑ ${sd}/${subs.length}</span>`:'')+
 `<span>${esc(t.list)}</span>`+(t.tags||[]).map(g=>`<span class="tag" data-act="tag" data-tag="${esc(g)}">#${esc(g)}</span>`).join('')+
 `</div></div></div>`;
}
function renderTasks(){
 const list=visible();
 if(!list.length){$('#content').innerHTML='<div class="empty">Nothing here yet.<br>Add a task above.</div>';return}
 let h='',last=null;
 list.forEach(t=>{
  if(S.view.id==='upcoming'&&t.due!==last){last=t.due;h+=`<div class="gh">${dueLabel(t.due)}</div>`}
  h+=row(t)});
 $('#content').innerHTML=h;
}
function streak(h){let d=today();if(!(h.log||{})[d])d=addDays(d,-1);let n=0;while((h.log||{})[d]){n++;d=addDays(d,-1)}return n}
function renderHabits(){
 const days=[...Array(7)].map((_,i)=>addDays(today(),i-6));
 let h=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="h-new" placeholder="New habit, e.g. Drink water" style="flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none"><button class="primary" data-act="hadd">Add</button></div>`;
 const hs=Object.values(S.habits).sort((a,b)=>a.created-b.created);
 if(!hs.length)h+='<div class="empty">No habits yet.</div>';
 hs.forEach(x=>{
  h+=`<div class="hab"><div class="hab-top"><div><b>${esc(x.name)}</b> <small>🔥 ${streak(x)} day streak</small></div><button class="x" data-act="hdel" data-id="${x.id}" title="Delete">×</button></div><div class="days">`+
  days.map(d=>`<div class="day">${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'narrow'})}<button class="${(x.log||{})[d]?'on':''}" data-act="hday" data-id="${x.id}" data-date="${d}" aria-label="${d}"></button></div>`).join('')+`</div></div>`});
 $('#content').innerHTML=h;
}
function renderFocus(){
 $('#content').innerHTML=`<div class="focus"><div class="modes">`+
 Object.entries(MODES).map(([k,v])=>`<button class="${F.mode===k?'on':''}" data-act="fmode" data-mode="${k}">${v[0]} ${v[1]}m</button>`).join('')+
 `</div><div id="f-time">${fmt(F.left)}</div><div class="row"><button class="primary" id="f-start" data-act="fstart">${F.run?'Pause':'Start'}</button><button data-act="freset">Reset</button></div><p style="color:var(--muted);margin-top:24px">Focus sessions today: <b>${sessions()}</b></p></div>`;
}
function renderMain(){
 const v=S.view;$('#title').textContent=searchQ?'Search':titleOf(v);
 $('#quick').hidden=!!searchQ||!(v.type==='list'||v.type==='tag'||(v.type==='smart'&&v.id!=='completed'));
 if(searchQ)renderTasks();
 else if(v.type==='tool')({habits:renderHabits,focus:renderFocus,calendar:renderCalendar,stats:renderStats})[v.id]();
 else renderTasks();
}
function render(){renderSide();renderMain()}

/* ---------- focus timer ---------- */
const MODES={focus:['Focus',25],short:['Short break',5],long:['Long break',15]};
const F={mode:'focus',left:25*60,end:0,run:false,timer:null};
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function sessions(){try{const j=JSON.parse(localStorage.getItem('mytasks_sess')||'{}');return j.d===today()?j.n:0}catch{return 0}}
function addSession(){try{localStorage.setItem('mytasks_sess',JSON.stringify({d:today(),n:sessions()+1}))}catch{}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);o.start();o.stop(c.currentTime+.6)}catch{}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}
function fPaint(){const el=$('#f-time');if(el)el.textContent=fmt(F.left);const b=$('#f-start');if(b)b.textContent=F.run?'Pause':'Start';document.title=F.run?fmt(F.left)+' · MyTasks':'MyTasks'}
function fTick(){if(F.run){F.left=Math.max(0,Math.round((F.end-Date.now())/1000));if(F.left<=0){fDone();return}}fPaint()}
function fStart(){if(F.run){F.run=false;clearInterval(F.timer)}else{F.run=true;F.end=Date.now()+F.left*1000;F.timer=setInterval(fTick,250)}fPaint()}
function fDone(){F.run=false;clearInterval(F.timer);beep();
 if(F.mode==='focus'){addSession();toast('Focus session done 🎉')}else toast('Break over');
 F.mode=F.mode==='focus'?'short':'focus';F.left=MODES[F.mode][1]*60;fPaint();if(S.view.id==='focus')renderMain()}
function fReset(){F.run=false;clearInterval(F.timer);F.left=MODES[F.mode][1]*60;fPaint()}

/* ---------- edit modal ---------- */
function openEdit(id){if(!S.tasks[id])return;M=JSON.parse(JSON.stringify(S.tasks[id]));renderModal();$('#modal').hidden=false}
function closeM(){M=null;$('#modal').hidden=true}
function collectM(){
 if(!M||!$('#m-title'))return;
 M.title=$('#m-title').value;M.notes=$('#m-notes').value;M.due=$('#m-due').value;M.time=$('#m-time').value;
 M.priority=Number($('#m-pri').value);M.list=$('#m-list').value;M.repeat=$('#m-rep').value;
 M.tags=$('#m-tags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
 M.subtasks=[...document.querySelectorAll('#m-subs .sub')].map(r=>({t:r.querySelector('.subt').value.trim(),d:r.querySelector('input[type=checkbox]').checked})).filter(s=>s.t);
}
function renderModal(){
 const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?'selected':''}>${esc(l)}</option>`;
 const lists=S.lists.includes(M.list)?S.lists:[...S.lists,M.list];
 $('#modal').innerHTML=`<div class="sheet">
 <input id="m-title" value="${esc(M.title)}" placeholder="Task title">
 <textarea id="m-notes" placeholder="Notes">${esc(M.notes||'')}</textarea>
 <div class="grid">
  <label>Due date<input type="date" id="m-due" value="${esc(M.due||'')}"></label>
  <label>Time (reminder)<input type="time" id="m-time" value="${esc(M.time||'')}"></label>
  <label>Priority<select id="m-pri">${[['0','None'],['1','Low'],['2','Medium'],['3','High']].map(([v,l])=>opt(v,l,String(M.priority)===v)).join('')}</select></label>
  <label>List<select id="m-list">${lists.map(l=>opt(l,l,l===M.list)).join('')}</select></label>
  <label>Repeat<select id="m-rep">${[['','Never'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([v,l])=>opt(v,l,(M.repeat||'')===v)).join('')}</select></label>
 </div>
 <label>Tags (comma separated)<input id="m-tags" value="${esc((M.tags||[]).join(', '))}"></label>
 <label>Subtasks</label>
 <div id="m-subs">${(M.subtasks||[]).map((s,i)=>`<div class="sub"><input type="checkbox" ${s.d?'checked':''}><input class="subt" value="${esc(s.t)}"><button data-m="sdel" data-i="${i}">×</button></div>`).join('')}</div>
 <input id="m-newsub" placeholder="Add subtask, press Enter">
 <div class="actions"><button class="danger" data-m="del">Delete</button><span></span><button data-m="cancel">Cancel</button><button class="primary" data-m="save">Save</button></div></div>`;
}
function saveM(){collectM();if(!M.title.trim()){toast('Title required');return}M.title=M.title.trim();DB.task(M);closeM()}

/* ---------- calendar ---------- */
function renderCalendar(){
 const first=new Date(calMonth+'T00:00:00'),y=first.getFullYear(),mo=first.getMonth();
 const start=(first.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
 const byDay={};Object.values(S.tasks).forEach(t=>{if(t.due&&!t.done)byDay[t.due]=(byDay[t.due]||0)+1});
 let h=`<div class="cal-h"><button data-act="calprev" aria-label="Previous month">‹</button><b>${first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button data-act="calnext" aria-label="Next month">›</button></div><div class="cal">`+
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="wd">${d}</div>`).join('');
 for(let i=0;i<start;i++)h+='<div></div>';
 for(let d=1;d<=dim;d++){const ds=`${y}-${pad(mo+1)}-${pad(d)}`;
  h+=`<button class="cd ${ds===today()?'td':''} ${ds===calSel?'sel':''}" data-act="calday" data-date="${ds}">${d}${byDay[ds]?'<i></i>':''}</button>`}
 h+='</div>';
 const list=Object.values(S.tasks).filter(t=>t.due===calSel).sort(cmp);
 h+=`<div class="gh">${dueLabel(calSel)}</div>`+(list.length?list.map(row).join(''):'<div class="empty" style="padding:20px">No tasks this day.</div>')+
  `<div style="display:flex;gap:8px;margin-top:8px"><input id="cal-new" placeholder="Add task on this day" style="flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none"><button class="primary" data-act="caladd">Add</button></div>`;
 $('#content').innerHTML=h;
}
function calAdd(){const i=$('#cal-new');if(!i)return;const p=parseQuick(i.value.trim());if(!p.title){toast('Add a title');return}
 DB.task({id:uid(),title:p.title,notes:'',due:calSel,time:p.time||'',priority:p.priority,list:'Inbox',tags:p.tags,subtasks:[],repeat:p.repeat,done:false,doneAt:0,created:Date.now()})}

/* ---------- stats ---------- */
function renderStats(){
 const T=Object.values(S.tasks),td=today(),open=T.filter(t=>!t.done);
 const doneOn=d=>T.reduce((n,t)=>n+(t.done&&t.doneAt&&ymd(new Date(t.doneAt))===d?1:0)+(t.hist||[]).filter(ts=>ymd(new Date(ts))===d).length,0);
 const days=[...Array(7)].map((_,i)=>addDays(td,i-6)),counts=days.map(doneOn),max=Math.max(1,...counts);
 const best=Math.max(0,...Object.values(S.habits).map(streak));
 const card=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
 $('#content').innerHTML=`<div class="stats">`+card(open.length,'Open tasks')+card(open.filter(t=>t.due&&t.due<td).length,'Overdue')+card(counts[6],'Done today')+
  card(counts.reduce((a,b)=>a+b,0),'Done in last 7 days')+card(best,'Best habit streak 🔥')+card(sessions(),'Focus sessions today')+
  `</div><div class="gh">Completed per day</div><div class="bars">`+
  days.map((d,i)=>`<div class="bar">${counts[i]}<div style="height:${Math.round(counts[i]/max*70)}px"></div>${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})}</div>`).join('')+`</div>`;
}

/* ---------- backup ---------- */
function exportData(){
 const data=JSON.stringify({tasks:Object.values(S.tasks),habits:Object.values(S.habits),lists:S.lists},null,1);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
 a.download='mytasks-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);let n=0;
   (j.lists||[]).forEach(l=>{if(typeof l==='string'&&l&&!S.lists.includes(l))S.lists.push(l)});
   (j.tasks||[]).forEach(t=>{if(t&&t.id&&t.title){t.list=t.list||'Inbox';if(!S.lists.includes(t.list))S.lists.push(t.list);
    t.priority=Number(t.priority)||0;t.created=t.created||Date.now();t.done=!!t.done;DB.task(t);n++}});
   (j.habits||[]).forEach(h=>{if(h&&h.id&&h.name){h.log=h.log||{};h.created=h.created||Date.now();DB.habit(h)}});
   DB.lists();toast('Imported '+n+' tasks')}catch{toast('Invalid backup file')}};
  r.readAsText(f)};
 i.click();
}

/* ---------- reminders (work while the app/tab is open) ---------- */
function notify(title,body,tag){
 const fb=()=>{try{new Notification(title,{body,tag})}catch{}};
 if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(title,{body,tag,icon:'icon.svg'}):fb()).catch(fb);else fb();
}
function checkReminders(){
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const now=new Date(),td=ymd(now),nowMin=now.getHours()*60+now.getMinutes();
 let seen={d:td,k:{}};try{const j=JSON.parse(localStorage.getItem('mytasks_seen')||'{}');if(j.d===td)seen=j}catch{}
 let ch=false;
 Object.values(S.tasks).forEach(t=>{
  if(t.done||!t.time||t.due!==td)return;
  const[h,m]=t.time.split(':').map(Number),diff=nowMin-(h*60+m);
  if(diff<0||diff>10)return;
  const k=t.id+t.time;if(seen.k[k])return;seen.k[k]=1;ch=true;
  notify('⏰ '+t.title,'Due '+t.time,k);toast('⏰ '+t.title)});
 if(ch)try{localStorage.setItem('mytasks_seen',JSON.stringify(seen))}catch{}
}
function clearSearch(){searchQ='';$('#search').value=''}
$('#search').addEventListener('input',e=>{searchQ=e.target.value.trim();renderMain()});

/* ---------- events ---------- */
$('#qadd').onclick=quickAdd;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')quickAdd()});
$('#menu').onclick=()=>$('#side').classList.toggle('open');

$('#side').addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');
 if(a){const act=a.dataset.act;
  if(act==='addlist'){const n=(prompt('New list name')||'').trim();if(n&&!S.lists.includes(n)){S.lists.push(n);DB.lists()}}
  else if(act==='dellist'){e.stopPropagation();const l=a.dataset.list;
   if(confirm(`Delete list "${l}"? Its tasks move to Inbox.`)){
    Object.values(S.tasks).filter(t=>t.list===l).forEach(t=>{t.list='Inbox';DB.task(t)});
    S.lists=S.lists.filter(x=>x!==l);if(S.view.type==='list'&&S.view.id===l)S.view={type:'smart',id:'today'};DB.lists()}}
  else if(act==='theme'){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('mytasks_theme',d)}catch{}}
  else if(act==='signout'){Auth.out&&Auth.out()}
  else if(act==='export'){exportData()}
  else if(act==='import'){importData()}
  else if(act==='notif'){
   if(!('Notification' in window)){toast('Notifications not supported here')}
   else Notification.requestPermission().then(p=>toast(p==='granted'?'Reminders on (works while the app is open)':'Permission denied'))}
  return}
 const g=e.target.closest('[data-go]');
 if(g){const s=g.dataset.go,i=s.indexOf(':');clearSearch();S.view={type:s.slice(0,i),id:s.slice(i+1)};$('#side').classList.remove('open');render()}
});

$('#content').addEventListener('click',e=>{
 const a=e.target.closest('[data-act]'),row=e.target.closest('.task');
 if(a){const act=a.dataset.act;
  if(act==='toggle'){toggle(row.dataset.id);return}
  if(act==='tag'){clearSearch();S.view={type:'tag',id:a.dataset.tag};render();return}
  if(act==='calprev'){calMonth=addMonths(calMonth,-1);renderCalendar();return}
  if(act==='calnext'){calMonth=addMonths(calMonth,1);renderCalendar();return}
  if(act==='calday'){calSel=a.dataset.date;renderCalendar();return}
  if(act==='caladd'){calAdd();return}
  if(act==='hadd')return addHabit();
  if(act==='hdel'){if(confirm('Delete this habit?'))DB.delHabit(a.dataset.id);return}
  if(act==='hday'){const h=S.habits[a.dataset.id];h.log=h.log||{};const d=a.dataset.date;if(h.log[d])delete h.log[d];else h.log[d]=true;DB.habit(h);return}
  if(act==='fstart')return fStart();
  if(act==='freset')return fReset();
  if(act==='fmode'){if(F.run){F.run=false;clearInterval(F.timer)}F.mode=a.dataset.mode;F.left=MODES[F.mode][1]*60;renderFocus();document.title='MyTasks';return}
 }
 if(row)openEdit(row.dataset.id);
});
function addHabit(){const i=$('#h-new');const n=i.value.trim();if(!n)return;DB.habit({id:uid(),name:n,log:{},created:Date.now()})}
$('#content').addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='h-new')addHabit();else if(e.target.id==='cal-new')calAdd()});

$('#modal').addEventListener('click',e=>{
 if(e.target.id==='modal'){closeM();return}
 const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
 if(m==='cancel')closeM();
 else if(m==='save')saveM();
 else if(m==='del'){if(confirm('Delete this task?')){const id=M.id;closeM();DB.delTask(id)}}
 else if(m==='sdel'){collectM();M.subtasks.splice(Number(b.dataset.i),1);renderModal()}
});
$('#modal').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='m-newsub'){const v=e.target.value.trim();if(!v)return;collectM();M.subtasks.push({t:v,d:false});renderModal();$('#m-newsub').focus()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});

/* ---------- auth UI ---------- */
function authErr(e){$('#a-err').textContent=((e&&e.code)||String(e)).replace('auth/','').replace(/-/g,' ')}
function authVals(){return[$('#a-email').value.trim(),$('#a-pass').value]}
$('#a-in').onclick=()=>{$('#a-err').textContent='';const[e,p]=authVals();Auth.in&&Auth.in(e,p).catch(authErr)};
$('#a-up').onclick=()=>{$('#a-err').textContent='';const[e,p]=authVals();Auth.up&&Auth.up(e,p).catch(authErr)};
$('#a-reset').onclick=ev=>{ev.preventDefault();const e=$('#a-email').value.trim();if(!e){$('#a-err').textContent='Enter your email first';return}Auth.reset(e).then(()=>{$('#a-err').textContent='Reset email sent'}).catch(authErr)};
['a-email','a-pass'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')$('#a-in').click()}));

/* ---------- cloud sync (Firebase) ---------- */
async function initCloud(){
 const base='https://www.gstatic.com/firebasejs/10.14.1/';
 const[A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
 let fdb;try{fdb=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({tabManager:Fs.persistentMultipleTabManager()})})}catch{fdb=Fs.getFirestore(app)}
 Auth.in=(e,p)=>Au.signInWithEmailAndPassword(auth,e,p);
 Auth.up=(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p);
 Auth.reset=e=>Au.sendPasswordResetEmail(auth,e);
 Auth.out=()=>Au.signOut(auth);
 let unsubs=[];
 Au.onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){DB.cloud=null;Auth.user=null;S.tasks={};S.habits={};S.lists=['Inbox'];$('#auth').hidden=false;render();return}
  Auth.user=u;$('#auth').hidden=true;
  const ref=(...p)=>Fs.doc(fdb,'users',u.uid,...p);
  DB.cloud={
   set:(c,id,d)=>Fs.setDoc(ref(c,id),d).catch(syncErr),
   del:(c,id)=>Fs.deleteDoc(ref(c,id)).catch(syncErr),
   setLists:l=>Fs.setDoc(ref('meta','settings'),{lists:l}).catch(syncErr)};
  unsubs.push(Fs.onSnapshot(Fs.collection(fdb,'users',u.uid,'tasks'),s=>{S.tasks={};s.forEach(d=>{S.tasks[d.id]={...d.data(),id:d.id}});render()},syncErr));
  unsubs.push(Fs.onSnapshot(Fs.collection(fdb,'users',u.uid,'habits'),s=>{S.habits={};s.forEach(d=>{S.habits[d.id]={...d.data(),id:d.id}});render()},syncErr));
  unsubs.push(Fs.onSnapshot(ref('meta','settings'),s=>{const l=s.exists()&&s.data().lists;S.lists=l&&l.length?l:['Inbox'];if(!S.lists.includes('Inbox'))S.lists.unshift('Inbox');render()},syncErr));
 });
}

/* ---------- boot ---------- */
(async function boot(){
 let th=null;try{th=localStorage.getItem('mytasks_theme')}catch{}
 if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 document.documentElement.dataset.theme=th;
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(checkReminders,30000);
 if(!FIREBASE_CONFIG){DB.loadLocal();render();return}
 render();
 try{await initCloud()}catch(e){console.error(e);toast('Cloud failed — using local mode');DB.cloud=null;DB.loadLocal();render()}
})();
</script>
